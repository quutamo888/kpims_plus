<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KPIMS AutoFill - Home</title>
  <style>
    :root { --bg: #f8fafc; --card-bg: #ffffff; --text: #0f172a; --text-muted: #475569; --primary: #2563eb; --border: #e2e8f0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; color: var(--text); background: var(--bg); margin: 0; padding: 60px 20px; display: flex; justify-content: center; align-items: center; min-height: 80vh; }
    .container { max-width: 650px; width: 100%; background: var(--card-bg); padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); border: 1px solid var(--border); text-align: center; }
    .badge { display: inline-block; background: #eff6ff; color: var(--primary); padding: 4px 12px; border-radius: 9999px; font-size: 13px; font-weight: 600; margin-bottom: 16px; }
    h1 { font-size: 28px; margin: 0 0 12px 0; color: var(--text); }
    p { color: var(--text-muted); font-size: 15px; margin-bottom: 30px; }
    .links-grid { display: flex; flex-direction: column; gap: 12px; }
    .btn { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; background: #f1f5f9; color: var(--text); text-decoration: none; border-radius: 10px; font-weight: 500; font-size: 15px; border: 1px solid var(--border); }
    .btn:hover { background: #e2e8f0; }
    .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    .footer { margin-top: 36px; font-size: 13px; color: var(--text-muted); }
  </style>
</head>
<body>
  <div class="container">
    <span class="badge">Official App Portal</span>
    <h1>KPIMS AutoFill</h1>
    <p>ส่วนขยายเว็บช่วยจัดทำและบันทึกรายงานผลการปฏิบัติงานรายวันบนระบบ KPIMS+ จาก Google Calendar</p>
    <div class="links-grid">
      <a href="privacy.html" class="btn btn-primary">
        <span>🔒 นโยบายความเป็นส่วนตัว (Privacy Policy)</span>
        <span>&rarr;</span>
      </a>
      <a href="terms.html" class="btn">
        <span>📜 ข้อกำหนดการใช้งาน (Terms of Service)</span>
        <span>&rarr;</span>
      </a>
      <a href="https://github.com/quutamo888/kpims_plus" class="btn" target="_blank">
        <span>💻 GitHub Source Repository</span>
        <span>&#8599;</span>
      </a>
    </div>
    <div class="footer">&copy; 2026 KPIMS AutoFill. All rights reserved.</div>
  </div>
</body>
</html>
